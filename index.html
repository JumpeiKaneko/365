<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>絵画を聴く — study (9)</title>
<style>
:root{
  --bg: #050506;
  --ink: #f0efe9;
  --ink-faint: rgba(240,239,233,0.34);
  --ink-fainter: rgba(240,239,233,0.14);
  --accent: #0028a8;
}
html,body{
  margin:0; padding:0; width:100%; height:100%;
  background:var(--bg); overflow:hidden;
  font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Helvetica Neue", sans-serif;
  color:var(--ink);
  -webkit-font-smoothing: antialiased;
  touch-action: none;
  -webkit-user-select:none; user-select:none;
}
#sketch-holder{ position:fixed; inset:0; touch-action:none; }
canvas{ display:block; }

#startOverlay{
  position:fixed; inset:0; z-index:20;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; background: transparent;
}
#startOverlay.hidden{ display:none; }
.ring{
  width:56px; height:56px; border-radius:50%;
  background: var(--accent);
  box-sizing:border-box;
  transition: transform .2s;
}
#startOverlay:active .ring{
  transform: scale(0.92);
}

#liveCount{
  position:fixed; right:22px; bottom:max(22px, env(safe-area-inset-bottom)); z-index:15;
  font-family: "Helvetica Neue", Arial, -apple-system, sans-serif;
  font-weight:700;
  font-size:19px; color:var(--accent);
  font-variant-numeric: tabular-nums; opacity:0; transition: opacity 1s ease;
}
#liveCount.show{ opacity:1; }
</style>
</head>
<body>

<div id="sketch-holder"></div>
<div id="startOverlay"><div class="ring"></div></div>
<div id="liveCount"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
/* ============================================================
   Firebase初期化
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyA54rAu9oAUtAt-Ej7A8_i0ed7GTEGSTtE",
  authDomain: "connection-decaying.firebaseapp.com",
  databaseURL: "https://connection-decaying-default-rtdb.firebaseio.com",
  projectId: "connection-decaying",
  storageBucket: "connection-decaying.firebasestorage.app",
  messagingSenderId: "986992358747",
  appId: "1:986992358747:web:9ce0310574b86b3e07567e",
  measurementId: "G-KGT8TGV8Y8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const shakeRef = db.ref('shakes');

/* ============================================================
   時間軸：現実の暦時間で1年かけて朽ちる
============================================================ */
const GLOBAL_START = new Date('2026-09-19T00:00:00+09:00');
const YEAR_MS = 365 * 24 * 60 * 60 * 1000;
const GLOBAL_END = new Date(GLOBAL_START.getTime() + YEAR_MS);

function decayFraction(){
  const now = Date.now();
  const t = (now - GLOBAL_START.getTime()) / (GLOBAL_END.getTime() - GLOBAL_START.getTime());
  return Math.min(1, Math.max(0, t));
}

/* ============================================================
   疑似乱数
============================================================ */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seedFromString(str){
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return (h ^ (h >>> 16)) >>> 0;
}

const KLEIN = [0, 40, 168];
const FLASH_COLOR = [130, 160, 235];
const PALETTE = [KLEIN, KLEIN, KLEIN];

const MAJOR_SCALE = [0,2,4,5,7,9,11];
function stackTones(n){
  const tones = [];
  let idx = 0;
  while (tones.length < n){
    const step = idx*2;
    const octave = Math.floor(step/7);
    const degree = step % 7;
    tones.push(MAJOR_SCALE[degree] + octave*12);
    idx++;
  }
  return tones;
}
function buildChord(seedNum, n){
  const rootMidiOffset = seedNum % 12;
  const root = 130.81 * Math.pow(2, rootMidiOffset/12);
  return stackTones(n).map(iv => root * Math.pow(2, iv/12));
}

let ballCount = 9;
const BALL_R = 26;
let balls = [];
let chordFreqs = [];

let audioCtx = null;
let masterGain = null;
let masterFilter = null;
let convolver = null;
let wetGain = null;
let running = false;
let activeVoices = 0;
const MAX_VOICES = 28;
const HIT_COOLDOWN = 160;

class Ball{
  constructor(x,y,freq,colorIdx,rank,noiseSeed){
    this.x=x; this.y=y; this.vx=0; this.vy=0;
    this.freq=freq; this.colorIdx=colorIdx; this.rank=rank;
    this.noiseSeed = noiseSeed;
    this.lastHit = -9999;
    this.flash = 0;
  }
}

let boundW, boundH, boundOffX = 0, boundOffY = 0;

function initBalls(seedNum){
  const r = mulberry32(seedNum);
  balls = [];
  const ranks = Array.from({length: ballCount}, (_,i)=>i);
  for (let i=ranks.length-1; i>0; i--){
    const j = Math.floor(r()*(i+1));
    [ranks[i], ranks[j]] = [ranks[j], ranks[i]];
  }
  for (let i=0; i<ballCount; i++){
    const x = boundOffX + r()*boundW;
    const y = boundOffY + r()*boundH;
    const colorIdx = i % PALETTE.length;
    balls.push(new Ball(x,y, chordFreqs[i], colorIdx, ranks[i], r()*1000));
  }
}

function createImpulseResponse(ctx, duration, decay){
  const rate = ctx.sampleRate;
  const length = Math.floor(rate*duration);
  const impulse = ctx.createBuffer(2, length, rate);
  for (let ch=0; ch<2; ch++){
    const data = impulse.getChannelData(ch);
    for (let i=0; i<length; i++){
      data[i] = (Math.random()*2-1) * Math.pow(1 - i/length, decay);
    }
  }
  return impulse;
}

function playChime(freq, panX, velMag, volumeScale){
  if (!audioCtx || activeVoices >= MAX_VOICES || volumeScale <= 0.003) return;
  activeVoices++;
  const now = audioCtx.currentTime;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.Q.value = 0.3;
  filter.frequency.setValueAtTime(700, now);
  filter.frequency.linearRampToValueAtTime(2400, now + 1.2);
  filter.frequency.linearRampToValueAtTime(500, now + 3.2);

  const gain = audioCtx.createGain();
  const peak = Math.min(0.24, 0.07 + velMag*0.45) * volumeScale;
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.linearRampToValueAtTime(peak, now + 0.32);
  gain.gain.linearRampToValueAtTime(peak*0.7, now + 1.0);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.4);

  const panner = audioCtx.createStereoPanner();
  panner.pan.value = Math.max(-1, Math.min(1, panX));

  const detunes = [0, 7, -9];
  const oscs = detunes.map(det => {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    osc.detune.value = det;
    osc.connect(filter);
    osc.start(now);
    osc.stop(now + 3.6);
    return osc;
  });
  const upper = audioCtx.createOscillator();
  upper.type = 'sine';
  upper.frequency.value = freq*2;
  const upperGain = audioCtx.createGain();
  upperGain.gain.value = 0.12;
  upper.connect(upperGain); upperGain.connect(filter);
  upper.start(now); upper.stop(now + 3.6);

  filter.connect(gain); gain.connect(panner); panner.connect(masterGain);

  const strikeGain = audioCtx.createGain();
  const strikePeak = Math.min(0.15, 0.035 + velMag*0.25) * volumeScale;
  strikeGain.gain.setValueAtTime(0.0001, now);
  strikeGain.gain.linearRampToValueAtTime(strikePeak, now + 0.005);
  strikeGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.1);
  const strikeFund = audioCtx.createOscillator();
  strikeFund.type = 'sine'; strikeFund.frequency.value = freq;
  const strikePartial = audioCtx.createOscillator();
  strikePartial.type = 'sine'; strikePartial.frequency.value = freq*2.76;
  const strikePartialGain = audioCtx.createGain();
  strikePartialGain.gain.value = 0.22;
  strikeFund.connect(strikeGain);
  strikePartial.connect(strikePartialGain); strikePartialGain.connect(strikeGain);
  strikeGain.connect(panner);
  strikeFund.start(now); strikePartial.start(now);
  strikeFund.stop(now + 1.2); strikePartial.stop(now + 1.2);

  oscs[0].onended = () => {
    try{
      oscs.forEach(o=>o.disconnect());
      upper.disconnect(); upperGain.disconnect();
      strikeFund.disconnect(); strikePartial.disconnect(); strikePartialGain.disconnect(); strikeGain.disconnect();
      filter.disconnect(); gain.disconnect(); panner.disconnect();
    }catch(e){}
    activeVoices--;
  };
}

/* ============================================================
   物理演算：共通の自律的な漂いと衝突計算
============================================================ */
function updatePhysics(aliveCount, speedScale, volumeScale, ballRadiusNow, nowMs){
  const active = balls.filter(b => b.rank < aliveCount);

  // 時間軸（Date.now）を用いた絶対決定論的な漂い計算
  const timeScale = nowMs * 0.00015;
  for (const b of active){
    const angle = noise(b.noiseSeed, timeScale) * Math.PI * 4;
    const force = 0.018 * speedScale;
    b.vx += Math.cos(angle) * force;
    b.vy += Math.sin(angle) * force;
    b.vx *= 0.975; b.vy *= 0.975;

    const sp = Math.hypot(b.vx, b.vy);
    const maxSp = 0.55 * speedScale;
    if (sp > maxSp && sp > 0){ b.vx = b.vx/sp*maxSp; b.vy = b.vy/sp*maxSp; }

    b.x += b.vx; b.y += b.vy;

    const r0 = ballRadiusNow;
    const minX = boundOffX+r0, maxX = boundOffX+boundW-r0;
    const minY = boundOffY+r0, maxY = boundOffY+boundH-r0;
    if (b.x < minX){ b.x = minX; b.vx = Math.abs(b.vx)*0.6; }
    if (b.x > maxX){ b.x = maxX; b.vx = -Math.abs(b.vx)*0.6; }
    if (b.y < minY){ b.y = minY; b.vy = Math.abs(b.vy)*0.6; }
    if (b.y > maxY){ b.y = maxY; b.vy = -Math.abs(b.vy)*0.6; }
  }

  // 衝突判定とローカルでの発音処理
  for (let i=0; i<active.length; i++){
    for (let j=i+1; j<active.length; j++){
      const a = active[i], b = active[j];
      const dx = b.x-a.x, dy = b.y-a.y;
      const dist = Math.hypot(dx,dy);
      if (dist > 0 && dist < ballRadiusNow*2){
        const nx = dx/dist, ny = dy/dist;
        const overlap = (ballRadiusNow*2 - dist)/2;
        a.x -= nx*overlap; a.y -= ny*overlap;
        b.x += nx*overlap; b.y += ny*overlap;
        const relVel = (b.vx-a.vx)*nx + (b.vy-a.vy)*ny;
        if (relVel < 0){
          a.vx += nx*relVel*0.9; a.vy += ny*relVel*0.9;
          b.vx -= nx*relVel*0.9; b.vy -= ny*relVel*0.9;
          const impact = Math.abs(relVel);
          
          if (nowMs - a.lastHit > HIT_COOLDOWN){
            a.lastHit = nowMs;
            a.flash = 1;
            playChime(a.freq, (a.x/width)*2-1, impact, volumeScale);
          }
          if (nowMs - b.lastHit > HIT_COOLDOWN){
            b.lastHit = nowMs;
            b.flash = 1;
            playChime(b.freq, (b.x/width)*2-1, impact, volumeScale);
          }
        }
      }
    }
  }
  return active;
}

/* ============================================================
   加速度センサー & Firebaseリアルタイムイベント共有
============================================================ */
let lastShakeTime = 0;
const SHAKE_THRESHOLD = 18;

function handleMotion(event){
  const acc = event.accelerationIncludingGravity;
  if (!acc) return;
  const magnitude = Math.sqrt(acc.x*acc.x + acc.y*acc.y + acc.z*acc.z);
  const now = Date.now();
  if (magnitude > SHAKE_THRESHOLD && now - lastShakeTime > 400 && balls.length > 0){
    lastShakeTime = now;
    
    // 全員共通で影響を与える「方向」と「強さ」を判定
    const angle = Math.atan2(acc.y, acc.x);
    const strength = Math.min(1.0, (magnitude - SHAKE_THRESHOLD) / 25);
    const targetIndex = Math.floor(Math.random() * balls.length);

    shakeRef.push({
      ballIndex: targetIndex,
      angle: angle,
      strength: strength,
      timestamp: now
    });
  }
}

function requestMotionPermission(){
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'){
    DeviceMotionEvent.requestPermission().then(state => {
      if (state === 'granted'){
        window.addEventListener('devicemotion', handleMotion);
      }
    }).catch(()=>{});
  } else {
    window.addEventListener('devicemotion', handleMotion);
  }
}

// 誰かが端末を揺らしたら、全端末の球に「大きな物理的撃発」と「視覚・音響インパルス」を与える
shakeRef.limitToLast(1).on('child_added', (snapshot) => {
  if (!running) return;
  const data = snapshot.val();
  if (!data || !balls.length) return;

  const b = balls[data.ballIndex];
  if (b){
    // 揺らしたベクトルに応じた強烈なインパルスを与える
    const force = 3.5 * data.strength;
    b.vx += Math.cos(data.angle) * force;
    b.vy += Math.sin(data.angle) * force;
    b.flash = 1.0; // 発光

    // 揺らされた球から全端末で同時に「揺らし検出音」を共鳴させる
    playChime(b.freq * 1.5, (b.x/width)*2-1, data.strength * 1.2, 1.0);
  }
});

/* ============================================================
   p5 セットアップ／描画
============================================================ */
function setup(){
  const cnv = createCanvas(windowWidth, windowHeight);
  cnv.parent(document.getElementById('sketch-holder'));
  colorMode(RGB, 255);
  computeBounds();
}
function computeBounds(){
  const margin = Math.min(width, height) * 0.16;
  boundOffX = margin; boundOffY = margin;
  boundW = width - margin*2; boundH = height - margin*2;
}
function windowResized(){ resizeCanvas(windowWidth, windowHeight); computeBounds(); }

function draw(){
  noStroke();
  fill(255,255,255);
  rect(0,0,width,height);

  if (!running) return;

  const t = decayFraction();
  const aliveCount = Math.round(ballCount * (1 - t));
  const speedScale = lerp(1.0, 0.05, t);
  const volumeScale = Math.max(0, 1 - t);
  const ballRadiusNow = Math.max(BALL_R*0.12, BALL_R * lerp(1.0, 0.12, t));

  if (masterFilter){
    const cutoff = lerp(9000, 180, t);
    masterFilter.frequency.setTargetAtTime(cutoff, audioCtx.currentTime, 1.2);
  }

  const active = updatePhysics(aliveCount, speedScale, volumeScale, ballRadiusNow, Date.now());

  for (const b of active){
    const col = PALETTE[b.colorIdx];
    noStroke();
    if (b.flash > 0.01){
      fill(FLASH_COLOR[0], FLASH_COLOR[1], FLASH_COLOR[2]);
      b.flash -= 0.06;
    } else {
      fill(col[0], col[1], col[2]);
    }
    circle(b.x, b.y, ballRadiusNow*2);
  }

  const daysLeft = Math.max(0, Math.ceil((GLOBAL_END.getTime() - Date.now()) / (24*60*60*1000)));
  const liveEl = document.getElementById('liveCount');
  liveEl.textContent = String(daysLeft).padStart(3,'0');
  liveEl.classList.add('show');
}

/* ============================================================
   起動
============================================================ */
document.getElementById('startOverlay').addEventListener('click', async ()=>{
  if (!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.6;
    masterFilter = audioCtx.createBiquadFilter();
    masterFilter.type = 'lowpass';
    masterFilter.frequency.value = 9000;

    convolver = audioCtx.createConvolver();
    convolver.buffer = createImpulseResponse(audioCtx, 7.5, 2.2);
    wetGain = audioCtx.createGain();
    wetGain.gain.value = 0.5;

    const limiter = audioCtx.createDynamicsCompressor();
    limiter.threshold.value = -18;
    limiter.knee.value = 24;
    limiter.ratio.value = 14;
    limiter.attack.value = 0.003;
    limiter.release.value = 0.25;

    masterGain.connect(masterFilter);
    masterGain.connect(convolver);
    convolver.connect(wetGain);
    wetGain.connect(masterFilter);
    masterFilter.connect(limiter);
    limiter.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  requestMotionPermission();
  startPiece();
  document.getElementById('startOverlay').classList.add('hidden');
});

function startPiece(){
  computeBounds();
  const params = new URLSearchParams(location.search);
  // URLクエリ（例: ?seed=123）が指定されていなければ全員「365」という共通種を使用
  const seedText = params.get('seed') || '365';
  const seedNum = seedFromString(seedText);
  
  chordFreqs = buildChord(seedNum, ballCount);
  initBalls(seedNum);
  running = true;
  console.log('seed:', seedNum, '/ 経過率:', (decayFraction()*100).toFixed(2)+'%');
}
</script>
