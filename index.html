<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>繋がり、朽ちる</title>
<style>
:root{
  --bg: #050506;
  --ink: #f0efe9;
  --accent: #0028a8;
}
html,body{
  margin:0; padding:0; width:100%; height:100%;
  background:var(--bg); overflow:hidden;
  font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Helvetica Neue", sans-serif;
  color:var(--ink);
  -webkit-font-smoothing: antialiased;
  touch-action: none;
  -webkit-user-select:none; user-select:none;
}
#sketch-holder{ position:fixed; inset:0; touch-action:none; }
canvas{ display:block; }

#startOverlay{
  position:fixed; inset:0; z-index:20;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; background: transparent;
}
#startOverlay.hidden{ display:none; }
.ring{
  width:56px; height:56px; border-radius:50%;
  background: var(--accent);
  box-sizing:border-box;
  transition: transform .2s;
}
#startOverlay:active .ring{ transform: scale(0.92); }

#liveCount{
  position:fixed; right:22px; bottom:max(22px, env(safe-area-inset-bottom)); z-index:15;
  font-family: "Helvetica Neue", Arial, -apple-system, sans-serif;
  font-weight:700; font-size:19px; color:var(--accent);
  font-variant-numeric: tabular-nums; opacity:0; transition: opacity 1s ease;
}
#liveCount.show{ opacity:1; }
</style>
</head>
<body>

<audio id="silent-audio" loop playsinline src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="></audio>

<div id="sketch-holder"></div>
<div id="startOverlay"><div class="ring"></div></div>
<div id="liveCount"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
/* ============================================================
   Firebase初期化 & Presence（オンライン人数計測）
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyA54rAu9oAUtAt-Ej7A8_i0ed7GTEGSTtE",
  authDomain: "connection-decaying.firebaseapp.com",
  databaseURL: "https://connection-decaying-default-rtdb.firebaseio.com",
  projectId: "connection-decaying",
  storageBucket: "connection-decaying.firebasestorage.app",
  messagingSenderId: "986992358747",
  appId: "1:986992358747:web:9ce0310574b86b3e07567e",
  measurementId: "G-KGT8TGV8Y8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let onlineCount = 1;
const presenceRef = db.ref('presence');
const myPresenceRef = presenceRef.push();

// 接続状態の監視
db.ref('.info/connected').on('value', (snap) => {
  if (snap.val() === true) {
    myPresenceRef.onDisconnect().remove();
    myPresenceRef.set(true);
  }
});

// オンライン人数のリアルタイム更新
presenceRef.on('value', (snap) => {
  if (snap.exists()) {
    onlineCount = snap.numChildren();
  } else {
    onlineCount = 1;
  }
});

/* ============================================================
   時間軸：開始前日（残り367日ベース）
============================================================ */
const GLOBAL_START = new Date('2026-09-19T00:00:00+09:00');
const YEAR_MS = 365 * 24 * 60 * 60 * 1000;
const GLOBAL_END = new Date(GLOBAL_START.getTime() + YEAR_MS);

function decayFraction(){
  const now = Date.now();
  const t = (now - GLOBAL_START.getTime()) / (GLOBAL_END.getTime() - GLOBAL_START.getTime());
  return Math.min(1, Math.max(0, t));
}

/* ============================================================
   決定論的擬似乱数
============================================================ */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seedFromString(str){
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return (h ^ (h >>> 16)) >>> 0;
}

const KLEIN = [0, 40, 168];
const FLASH_COLOR = [130, 160, 235];
const PALETTE = [KLEIN, KLEIN, KLEIN];

const MAJOR_SCALE = [0,2,4,5,7,9,11];
function stackTones(n){
  const tones = [];
  let idx = 0;
  while (tones.length < n){
    const step = idx*2;
    const octave = Math.floor(step/7);
    const degree = step % 7;
    tones.push(MAJOR_SCALE[degree] + octave*12);
    idx++;
  }
  return tones;
}
function buildChord(seedNum, n){
  const rootMidiOffset = seedNum % 12;
  const root = 130.81 * Math.pow(2, rootMidiOffset/12);
  return stackTones(n).map(iv => root * Math.pow(2, iv/12));
}

let ballCount = 9;
const BALL_R = 26;
let balls = [];
let chordFreqs = [];

let audioCtx = null;
let masterGain = null;
let masterFilter = null;
let convolver = null;
let wetGain = null;
let running = false;
let activeVoices = 0;
const MAX_VOICES = 28;
const HIT_COOLDOWN = 160;

class Ball{
  constructor(x,y,freq,colorIdx,rank,noiseSeed){
    this.x=x; this.y=y; this.vx=0; this.vy=0;
    this.freq=freq; this.colorIdx=colorIdx; this.rank=rank;
    this.noiseSeed = noiseSeed;
    this.lastHit = -9999;
    this.flash = 0;
  }
}

let boundW, boundH, boundOffX = 0, boundOffY = 0;

function initBalls(seedNum){
  const r = mulberry32(seedNum);
  balls = [];
  const ranks = Array.from({length: ballCount}, (_,i)=>i);
  for (let i=ranks.length-1; i>0; i--){
    const j = Math.floor(r()*(i+1));
    [ranks[i], ranks[j]] = [ranks[j], ranks[i]];
  }
  for (let i=0; i<ballCount; i++){
    const x = boundOffX + r()*boundW;
    const y = boundOffY + r()*boundH;
    const colorIdx = i % PALETTE.length;
    balls.push(new Ball(x,y, chordFreqs[i], colorIdx, ranks[i], r()*1000));
  }
}

function createImpulseResponse(ctx, duration, decay){
  const rate = ctx.sampleRate;
  const length = Math.floor(rate*duration);
  const impulse = ctx.createBuffer(2, length, rate);
  for (let ch=0; ch<2; ch++){
    const data = impulse.getChannelData(ch);
    for (let i=0; i<length; i++){
      data[i] = (Math.random()*2-1) * Math.pow(1 - i/length, decay);
    }
  }
  return impulse;
}

/* ============================================================
   音響生成（接続人数 onlineCount に応じて和音・倍音を可変）
============================================================ */
function playChime(freq, panX, velMag, volumeScale){
  if (!audioCtx || activeVoices >= MAX_VOICES || volumeScale <= 0.003) return;
  activeVoices++;
  const now = audioCtx.currentTime;

  // 人数が増えるほどフィルターが開放され、明るい音に変化
  const cutoffFreq = Math.min(8000, 700 + (onlineCount - 1) * 600);
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.Q.value = 0.3;
  filter.frequency.setValueAtTime(cutoffFreq, now);

  const gain = audioCtx.createGain();
  const peak = Math.min(0.24, 0.07 + velMag*0.45) * volumeScale;
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.linearRampToValueAtTime(peak, now + 0.32);
  gain.gain.linearRampToValueAtTime(peak*0.7, now + 1.0);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.4);

  const panner = audioCtx.createStereoPanner();
  panner.pan.value = Math.max(-1, Math.min(1, panX));

  // 接続人数に応じて生成するデチューン音脈数を変化
  const detunes = [0];
  if (onlineCount >= 2) detunes.push(7);
  if (onlineCount >= 3) detunes.push(-9);
  if (onlineCount >= 5) detunes.push(14);

  const oscs = detunes.map(det => {
    const osc = audioCtx.createOscillator();
    osc.type = 'sine'; osc.frequency.value = freq; osc.detune.value = det;
    osc.connect(filter); osc.start(now); osc.stop(now + 3.6);
    return osc;
  });

  filter.connect(gain); gain.connect(panner); panner.connect(masterGain);

  oscs[0].onended = () => {
    try{
      oscs.forEach(o=>o.disconnect());
      filter.disconnect(); gain.disconnect(); panner.disconnect();
    }catch(e){}
    activeVoices--;
  };
}

/* ============================================================
   物理演算
============================================================ */
function updatePhysics(aliveCount, speedScale, volumeScale, ballRadiusNow, nowMs){
  const active = balls.filter(b => b.rank < aliveCount);

  const timeScale = nowMs * 0.00015;
  for (const b of active){
    const angle = noise(b.noiseSeed, timeScale) * Math.PI * 4;
    const force = 0.018 * speedScale;
    b.vx += Math.cos(angle) * force;
    b.vy += Math.sin(angle) * force;
    
    b.vx *= 0.98; b.vy *= 0.98;

    b.x += b.vx; b.y += b.vy;

    const r0 = ballRadiusNow;
    const minX = boundOffX+r0, maxX = boundOffX+boundW-r0;
    const minY = boundOffY+r0, maxY = boundOffY+boundH-r0;
    if (b.x < minX){ b.x = minX; b.vx = Math.abs(b.vx)*0.8; }
    if (b.x > maxX){ b.x = maxX; b.vx = -Math.abs(b.vx)*0.8; }
    if (b.y < minY){ b.y = minY; b.vy = Math.abs(b.vy)*0.8; }
    if (b.y > maxY){ b.y = maxY; b.vy = -Math.abs(b.vy)*0.8; }
  }

  for (let i=0; i<active.length; i++){
    for (let j=i+1; j<active.length; j++){
      const a = active[i], b = active[j];
      const dx = b.x-a.x, dy = b.y-a.y;
      const dist = Math.hypot(dx,dy);
      if (dist > 0 && dist < ballRadiusNow*2){
        const nx = dx/dist, ny = dy/dist;
        const overlap = (ballRadiusNow*2 - dist)/2;
        a.x -= nx*overlap; a.y -= ny*overlap;
        b.x += nx*overlap; b.y += ny*overlap;
        const relVel = (b.vx-a.vx)*nx + (b.vy-a.vy)*ny;
        if (relVel < 0){
          a.vx += nx*relVel*0.9; a.vy += ny*relVel*0.9;
          b.vx -= nx*relVel*0.9; b.vy -= ny*relVel*0.9;
          const impact = Math.abs(relVel);
          
          if (nowMs - a.lastHit > HIT_COOLDOWN){
            a.lastHit = nowMs; a.flash = 1;
            playChime(a.freq, (a.x/width)*2-1, impact, volumeScale);
          }
          if (nowMs - b.lastHit > HIT_COOLDOWN){
            b.lastHit = nowMs; b.flash = 1;
            playChime(b.freq, (b.x/width)*2-1, impact, volumeScale);
          }
        }
      }
    }
  }
  return active;
}

/* ============================================================
   音声復帰
============================================================ */
async function unlockAudio() {
  const silentAudio = document.getElementById('silent-audio');
  if (silentAudio && silentAudio.paused) {
    silentAudio.play().catch(() => {});
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    await audioCtx.resume();
  }
}

window.addEventListener('touchstart', unlockAudio, { passive: true });
window.addEventListener('click', unlockAudio, { passive: true });

/* ============================================================
   p5 描画
============================================================ */
function setup(){
  const cnv = createCanvas(windowWidth, windowHeight);
  cnv.parent(document.getElementById('sketch-holder'));
  colorMode(RGB, 255);
  computeBounds();
}
function computeBounds(){
  const margin = Math.min(width, height) * 0.16;
  boundOffX = margin; boundOffY = margin;
  boundW = width - margin*2; boundH = height - margin*2;
}
function windowResized(){ resizeCanvas(windowWidth, windowHeight); computeBounds(); }

function draw(){
  noStroke();
  fill(255,255,255);
  rect(0,0,width,height);

  if (!running) return;

  const t = decayFraction();
  const aliveCount = Math.round(ballCount * (1 - t));
  const speedScale = lerp(1.0, 0.05, t);
  const volumeScale = Math.max(0, 1 - t);
  const ballRadiusNow = Math.max(BALL_R*0.12, BALL_R * lerp(1.0, 0.12, t));

  if (masterFilter){
    const cutoff = lerp(9000, 180, t);
    masterFilter.frequency.setTargetAtTime(cutoff, audioCtx.currentTime, 1.2);
  }

  const active = updatePhysics(aliveCount, speedScale, volumeScale, ballRadiusNow, Date.now());

  for (const b of active){
    const col = PALETTE[b.colorIdx];
    noStroke();
    if (b.flash > 0.01){
      fill(FLASH_COLOR[0], FLASH_COLOR[1], FLASH_COLOR[2]);
      b.flash -= 0.06;
    } else {
      fill(col[0], col[1], col[2]);
    }
    circle(b.x, b.y, ballRadiusNow*2);
  }

  // 残り日数の計算（現在時点ベースで367日表示）
  const daysLeft = Math.max(0, Math.ceil((GLOBAL_END.getTime() - Date.now()) / (24*60*60*1000)));
  const formattedCount = String(onlineCount).padStart(2, '0');
  
  const liveEl = document.getElementById('liveCount');
  liveEl.textContent = `${formattedCount} / ${daysLeft}`;
  liveEl.classList.add('show');
}

/* ============================================================
   起動
============================================================ */
document.getElementById('startOverlay').addEventListener('click', async ()=>{
  if (!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.6;
    masterFilter = audioCtx.createBiquadFilter();
    masterFilter.type = 'lowpass';
    masterFilter.frequency.value = 9000;

    convolver = audioCtx.createConvolver();
    convolver.buffer = createImpulseResponse(audioCtx, 7.5, 2.2);
    wetGain = audioCtx.createGain();
    wetGain.gain.value = 0.5;

    const limiter = audioCtx.createDynamicsCompressor();
    limiter.threshold.value = -18;
    limiter.knee.value = 24;
    limiter.ratio.value = 14;
    limiter.attack.value = 0.003;
    limiter.release.value = 0.25;

    masterGain.connect(masterFilter);
    masterGain.connect(convolver);
    convolver.connect(wetGain);
    wetGain.connect(masterFilter);
    masterFilter.connect(limiter);
    limiter.connect(audioCtx.destination);
  }
  await unlockAudio();
  startPiece();
  document.getElementById('startOverlay').classList.add('hidden');
});

function startPiece(){
  computeBounds();
  const params = new URLSearchParams(location.search);
  const seedText = params.get('seed') || '365';
  const seedNum = seedFromString(seedText);
  
  chordFreqs = buildChord(seedNum, ballCount);
  initBalls(seedNum);
  running = true;
}
</script>
</body>
</html>
